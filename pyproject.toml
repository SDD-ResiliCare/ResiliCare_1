[project]
name = "resilicare-1"
version = "0.1.0"
description = "Production-grade emergency department triage platform"
readme = "README.md"
authors = [
    { name = "premagarwals", email = "prem12937@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "supabase>=2.12,<3",
    "uvicorn[standard]>=0.34,<1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]
nlp = [
    "librosa==0.10.1",
    "soundfile==0.12.1",
    "spacy==3.7.2",
    "torch",
    "torchaudio",
    "transformers==4.36.2",
]

[tool.pyright]
include = ["."]
extraPaths = ["."]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests", "src/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
